services:
  db:
    image: postgres:16
    container_name: coaching_db
    restart: always
    environment:
      POSTGRES_DB: coaching_db
      POSTGRES_USER: coaching_user
      POSTGRES_PASSWORD: coaching_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching_user -d coaching_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./backend
    container_name: coaching_web
    user: "${UID}:${GID}"
    env_file: ./backend/.env
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
