# Standalone nginx site config — deploy to /etc/nginx/sites-available/football-academy
# then: sudo ln -s /etc/nginx/sites-available/football-academy /etc/nginx/sites-enabled/
#
# Replace PROJECT_ROOT with the absolute path to this repo on the server,
# e.g. /home/deploy/football-coaching-platform
#
# Gunicorn is expected to be running on 127.0.0.1:8000 (adjust if different).

upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    client_max_body_size 10M;

    # User-uploaded media — served by nginx, never touches gunicorn
    location /media/ {
        alias PROJECT_ROOT/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django-collected static files (admin CSS, etc.)
    location /static/ {
        alias PROJECT_ROOT/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
